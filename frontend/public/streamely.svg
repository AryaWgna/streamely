<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .bg { 
      fill: #ffffff; 
      stroke: #e4e4e7; 
      stroke-width: 1px;
    }
    @media (prefers-color-scheme: dark) {
      .bg { 
        fill: #09090b; 
        stroke: #27272a; 
        stroke-width: 1px;
      }
    }
  </style>
  <defs>
    <linearGradient id="streamely-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect class="bg" x="1" y="1" width="22" height="22" rx="6" />
  <path d="M10 8v8l6-4z" fill="url(#streamely-gradient)" filter="url(#glow)" />
</svg>
